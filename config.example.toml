# Copia este archivo a config.toml (está en .gitignore) y ajústalo.
network = "mainnet"      # "mainnet" | "testnet"
mode = "paper"           # "paper" | "live" (live requiere además el flag --live)
poll_seconds = 5

# Líderes a copiar. `weight` = fracción relativa del capital asignada a cada uno.
# Obtén candidatos con: python -m copytrading discover
# [[leaders]]
# address = "0x0000000000000000000000000000000000000000"
# weight = 1.0

[scoring]
min_trades = 30
min_active_days = 14
min_account_value = 10000
min_win_rate = 0.40
min_profit_factor = 1.3
max_drawdown = 0.35
max_top_trade_share = 0.40
min_avg_hold_minutes = 15
max_trades_per_day = 50
max_days_since_last_trade = 7
lookback_days = 90

[risk]
my_equity = 1000
size_multiplier = 1.0
max_leverage = 3.0
max_position_pct = 0.25
min_order_usd = 11
rebalance_threshold_pct = 0.10
max_entry_deviation_pct = 0.01
copy_existing_positions = false
stop_loss_pct = 0.08
daily_loss_limit_pct = 0.05
allowed_coins = []
blocked_coins = []
